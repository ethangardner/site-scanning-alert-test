name: Site Scanning Alerts

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: site-scanning-alerts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: GSA/site-scanning-alert-template@9027be2fd9cd49048b64b06ae2be19326444bdb6
        with:
          watchlist: watchlist.txt
          dry_run: false
