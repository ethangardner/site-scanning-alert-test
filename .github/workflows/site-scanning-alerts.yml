name: Site Scanning Alerts

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: site-scanning-alerts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: GSA/site-scanning-alert-template@3183687c2f44239c5ab1665368f53df018ec2650
        with:
          watchlist: watchlist.txt
          dry_run: false
